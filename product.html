<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Product — SplendyCraft</title>
<meta name="description" id="pageDescription" content="Handcrafted Indian heritage decor from SplendyCraft.">
<link rel="icon" type="image/png" href="./logo.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Cinzel:wght@400;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.breadcrumb{padding:8.5rem 4.5rem 0}
.breadcrumb a{font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--brown);text-decoration:none;transition:color 0.2s}
.breadcrumb a:hover{color:var(--rust)}

.product-detail{padding:2.5rem 4.5rem 6rem;display:grid;grid-template-columns:1.1fr 1fr;gap:4rem;align-items:start}

/* GALLERY */
.gallery{position:sticky;top:100px}
.gallery-main{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:#EFE6D4;border:1px solid rgba(201,151,58,0.14)}
.gallery-main img{width:100%;height:100%;object-fit:cover;display:block;opacity:1;transition:opacity 0.35s ease}
.gallery-main img.fading{opacity:0}
.gallery-arrow{
  position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
  border:1px solid rgba(226,185,106,0.4);background:rgba(26,18,8,0.55);color:var(--gold-pale);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.3rem;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all 0.3s;z-index:5;
}
.gallery-arrow:hover{background:rgba(201,151,58,0.85);color:var(--dark)}
.gallery-arrow.prev{left:1rem}
.gallery-arrow.next{right:1rem}
.gallery-thumbs{display:flex;gap:0.8rem;margin-top:1rem;overflow-x:auto;padding-bottom:0.3rem}
.gallery-thumb{
  width:76px;height:76px;flex-shrink:0;overflow:hidden;cursor:pointer;
  border:2px solid transparent;opacity:0.6;transition:all 0.25s;
}
.gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.gallery-thumb:hover{opacity:0.9}
.gallery-thumb.active{border-color:var(--gold);opacity:1}

/* INFO */
.product-info .eyebrow{color:var(--rust)}
.product-info h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.2rem,4vw,3rem);font-weight:400;color:var(--dark);line-height:1.14;margin-bottom:1.2rem}
.product-rule{width:56px;height:2px;background:linear-gradient(to right,var(--rust),transparent);margin-bottom:1.6rem}
.product-long-desc{font-size:1rem;line-height:1.88;font-weight:300;color:var(--brown);margin-bottom:2.2rem}

.spec-list{border-top:1px solid rgba(160,69,26,0.16);margin-bottom:2.4rem}
.spec-row{display:grid;grid-template-columns:160px 1fr;gap:1.5rem;padding:1rem 0;border-bottom:1px solid rgba(160,69,26,0.16)}
.spec-label{font-size:0.66rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--rust);font-weight:500;padding-top:0.15rem}
.spec-value{font-size:0.92rem;line-height:1.6;font-weight:300;color:var(--dark)}

.whatsapp-btn{
  display:flex;align-items:center;justify-content:center;gap:0.8rem;width:100%;
  padding:1.15rem 1.5rem;background:linear-gradient(135deg,var(--teal),var(--teal-lt));
  color:var(--ivory);text-decoration:none;font-family:'Jost',sans-serif;
  font-size:0.82rem;letter-spacing:0.14em;text-transform:uppercase;font-weight:500;
  border:none;cursor:pointer;transition:all 0.35s;box-shadow:0 10px 30px rgba(30,107,104,0.25);
}
.whatsapp-btn:hover{box-shadow:0 14px 40px rgba(30,107,104,0.4);transform:translateY(-2px)}
.whatsapp-note{font-size:0.75rem;color:rgba(90,52,16,0.6);text-align:center;margin-top:0.8rem;font-weight:300}

.not-found{padding:10rem 1.5rem 6rem;text-align:center}
.not-found h1{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:400;color:var(--dark);margin-bottom:1rem}
.not-found a{color:var(--rust);text-decoration:none;border-bottom:1px solid rgba(160,69,26,0.4)}

@media(max-width:880px){
  .breadcrumb{padding:7rem 1.5rem 0}
  .product-detail{padding:2rem 1.5rem 4rem;grid-template-columns:1fr;gap:2.5rem}
  .gallery{position:static}
}
</style>
</head>
<body>

<nav id="nav">
  <div class="nav-logo">Splendy<em>Craft</em></div>
  <ul class="nav-links">
    <li><a href="index.html#home">Home</a></li>
    <li><a href="index.html#story">Our Story</a></li>
    <li><a href="index.html#why">Why Us</a></li>
    <li><a href="products.html" class="active">Products</a></li>
    <li><a href="index.html#support">Support</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</nav>

<div class="breadcrumb"><a href="products.html">&larr; Back to Collections</a></div>

<div id="productRoot"></div>

<footer>
  <div class="footer-top">
    <div class="footer-logo">Splendy<em>Craft</em></div>
    <div class="footer-tagline">Curated Heritage, Elevated Living</div>
  </div>
  <div class="footer-bottom">
    <span>© 2026 SplendyCraft. All rights reserved.</span>
    <span>Made with devotion in India ✦</span>
  </div>
</footer>

<script type="module">
import { getProducts } from "./product-Firestore.js";

(async function(){
  /*
    ╔══════════════════════════════════════════════════════════╗
    ║  HOW TO SET THE WHATSAPP NUMBER                          ║
    ║                                                            ║
    ║  Replace 91XXXXXXXXXX below with the real business        ║
    ║  WhatsApp number, digits only, country code first          ║
    ║  (e.g. 919876543210 for +91 98765 43210).                  ║
    ╚══════════════════════════════════════════════════════════╝
  */
  const WHATSAPP_NUMBER = "91XXXXXXXXXX";

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const allProducts = await getProducts();
  const product = allProducts.find(p => p.id === id);
  const root = document.getElementById('productRoot');

  if (!product) {
    root.innerHTML = `
      <div class="not-found">
        <h1>We couldn't find that product</h1>
        <p><a href="products.html">Browse the full collection instead &rarr;</a></p>
      </div>
    `;
  } else {
    document.title = product.name + " — SplendyCraft";
    document.getElementById('pageDescription').setAttribute('content', product.shortDescription);

    const message = `Hello SplendyCraft,\n\nI am interested in the ${product.name} shown on your website. Could you please tell me its current price and availability?\n\nThank you.`;
    const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;

    root.innerHTML = `
      <div class="product-detail">
        <div class="gallery reveal">
          <div class="gallery-main">
            <img id="mainImage" src="${product.images[0]}" alt="${product.name}">
            ${product.images.length > 1 ? `
              <button class="gallery-arrow prev" id="prevBtn" aria-label="Previous image">&#10094;</button>
              <button class="gallery-arrow next" id="nextBtn" aria-label="Next image">&#10095;</button>
            ` : ''}
          </div>
          ${product.images.length > 1 ? `
            <div class="gallery-thumbs" id="thumbRow">
              ${product.images.map((img, i) => `
                <div class="gallery-thumb${i === 0 ? ' active' : ''}" data-index="${i}">
                  <img src="${img}" alt="${product.name} view ${i + 1}" loading="lazy">
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>

        <div class="product-info reveal d1">
          <div class="eyebrow">${product.category}</div>
          <h1>${product.name}</h1>
          <div class="product-rule"></div>
          <p class="product-long-desc">${product.longDescription}</p>

          <div class="spec-list">
            <div class="spec-row"><div class="spec-label">Material</div><div class="spec-value">${product.material}</div></div>
            <div class="spec-row"><div class="spec-label">Dimensions</div><div class="spec-value">${product.dimensions}</div></div>
            <div class="spec-row"><div class="spec-label">Color</div><div class="spec-value">${product.color}</div></div>
            <div class="spec-row"><div class="spec-label">Craftsmanship</div><div class="spec-value">${product.craftsmanship}</div></div>
            <div class="spec-row"><div class="spec-label">Care Instructions</div><div class="spec-value">${product.care}</div></div>
            <div class="spec-row"><div class="spec-label">Availability</div><div class="spec-value">${product.availability}</div></div>
          </div>

          <a class="whatsapp-btn" href="${waLink}" target="_blank" rel="noopener">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5C10 9 9.4 7.6 9.1 7c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.1 0 1.2.9 2.4 1 2.6.1.2 1.8 2.8 4.4 3.9.6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.5-.3zM12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.7 1.5 5.2L2 22l4.9-1.3C8.4 21.5 10.1 22 12 22c5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
            Contact on WhatsApp
          </a>
          <div class="whatsapp-note">Opens WhatsApp with a pre-filled message about this piece</div>
        </div>
      </div>
    `;

    // Gallery interaction
    if (product.images.length > 1) {
      let current = 0;
      const mainImg = document.getElementById('mainImage');
      const thumbs = document.querySelectorAll('.gallery-thumb');

      function goTo(index){
        current = (index + product.images.length) % product.images.length;
        mainImg.classList.add('fading');
        setTimeout(() => {
          mainImg.src = product.images[current];
          mainImg.classList.remove('fading');
        }, 180);
        thumbs.forEach((t, i) => t.classList.toggle('active', i === current));
      }

      document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
      document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
      thumbs.forEach(t => t.addEventListener('click', () => goTo(parseInt(t.dataset.index, 10))));

      // Mobile swipe support
      let touchStartX = 0;
      const mainEl = document.querySelector('.gallery-main');
      mainEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
      mainEl.addEventListener('touchend', e => {
        const delta = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(delta) > 40) goTo(current + (delta < 0 ? 1 : -1));
      }, { passive: true });

      // Keyboard arrow support
      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') goTo(current - 1);
        if (e.key === 'ArrowRight') goTo(current + 1);
      });
    }
  }

  // Fade-in-on-scroll, same pattern used site-wide
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('up'); });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

  // Nav scroll state (matches index.html behavior)
  const navEl = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    navEl.classList.toggle('scrolled', window.scrollY > 80);
  });
})();
</script>
</body>
</html>
